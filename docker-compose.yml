x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__HealthAuthorization: "Server=sqlserver,1433;Database=HealthAuthorizationDb;User ID=sa;Password=\"${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}\";Encrypt=True;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -d master -b -l 3 -Q "SELECT 1" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  migrate:
    build:
      context: .
      target: tooling
    depends_on:
      sqlserver:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - jwt-secrets:/home/app/.microsoft/usersecrets
    entrypoint: ["dotnet"]
    command:
      - ef
      - database
      - update
      - --project
      - src/HealthAuthorization.Infrastructure
      - --startup-project
      - src/HealthAuthorization.API
      - --context
      - HealthAuthorizationDbContext
      - --configuration
      - Release
      - --no-build
      - --
      - --environment
      - Development
    restart: "no"

  api:
    build:
      context: .
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-5044}:8080"
    volumes:
      - jwt-secrets:/home/app/.microsoft/usersecrets:ro

volumes:
  sql-data:
  jwt-secrets:
